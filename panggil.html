<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemanggil - Spinbooth</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="common.js"></script></head><body>
<h1>Panel Pemanggil</h1><div class="card"><input id="pin" type="password" placeholder="PIN pemanggil" inputmode="numeric"></div>
<div class="card" style="text-align:center"><div>Sedang dipanggil</div><div class="big" id="cur">-</div><div id="wait"></div></div>
<button class="y" onclick="act('call_next')">Panggil Berikutnya</button><button onclick="act('recall')">Panggil Ulang</button><div id="msg"></div>
<div class="card"><b>Antrean menunggu</b><div id="list">-</div></div>
<script>
const $=id=>document.getElementById(id);$("pin").value=localStorage.getItem("cpin")||"";
async function load(){const {data}=await sb.from("tickets").select("*").eq("queue_date",today()).order("created_at").order("id");const r=data||[],c=r.find(t=>t.status==="called"),w=r.filter(t=>t.status==="waiting");
 $("cur").textContent=c?fmt(c):"-";$("wait").textContent="Menunggu: "+w.length;$("list").textContent=w.slice(0,10).map(fmt).join(", ")||"-"}
async function act(fn){localStorage.setItem("cpin",$("pin").value);$("msg").textContent="";
 const {data,error}=await sb.rpc(fn,{p_pin:$("pin").value});
 if(error){$("msg").textContent=error.message;return}
 if(!data)$("msg").textContent="Tidak ada antrian menunggu";load()}
sb.channel("p").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},load).subscribe();setInterval(load,10000);load();
</script></body></html>
