<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Antrian - Spinbooth</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="common.js"></script></head><body>
<h1>Antrian Spinbooth</h1><div id="off" class="card" style="display:none;text-align:center;font-weight:700">Antrian sedang tidak aktif</div>
<div class="card" style="text-align:center"><div>Sedang dipanggil</div><div class="big" id="cur">-</div><div id="wait"></div></div>
<div class="card"><b>Nomor saya</b><input id="my" placeholder="contoh: B-003" style="margin-top:8px;text-transform:uppercase"><div id="mine" style="margin-top:8px;font-weight:700"></div>
<label style="display:block;margin-top:8px"><input type="checkbox" id="snd" style="width:auto"> Suara &amp; getar saat dipanggil</label></div>
<div class="card"><b>Berikutnya</b><div id="next">-</div></div><div class="card"><b>Sudah dipanggil</b><div id="done">-</div></div>
<script>
const $=id=>document.getElementById(id);let lastCall="";
$("my").value=localStorage.getItem("my")||"";$("my").oninput=()=>{localStorage.setItem("my",$("my").value);load(true)};
function say(t){if(!$("snd").checked)return;navigator.vibrate&&navigator.vibrate([300,150,300]);const u=new SpeechSynthesisUtterance("Nomor antrian "+t.letter+", "+String(t.num).padStart(3,"0").split("").join(" ")+", silakan menuju kasir");u.lang="id-ID";speechSynthesis.speak(u)}
async function load(quiet){$("off").style.display=(await isActive())?"none":"block";const {data}=await sb.from("tickets").select("*").eq("queue_date",today()).order("created_at").order("id");const r=data||[];
 const c=r.find(t=>t.status==="called"),w=r.filter(t=>t.status==="waiting"),d=r.filter(t=>t.status==="done").slice(-5).reverse();
 $("cur").textContent=c?fmt(c):"-";$("wait").textContent="Menunggu: "+w.length;
 $("next").textContent=w.slice(0,3).map(fmt).join(", ")||"-";$("done").textContent=d.map(fmt).join(", ")||"-";
 const m=$("my").value.trim().toUpperCase(),t=r.find(x=>fmt(x)===m);
 $("mine").textContent=!m?"":!t?"Nomor tidak ditemukan hari ini":t.status==="called"?"Giliran Anda! Silakan ke kasir":t.status==="done"?"Sudah dipanggil":"Antrian di depan Anda: "+w.findIndex(x=>x.id===t.id);
 const key=c?c.id+"|"+c.called_at:"";if(!quiet&&key&&key!==lastCall&&c&&fmt(c)===m)say(c);lastCall=key}
sb.channel("s").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},()=>load()).on("postgres_changes",{event:"*",schema:"public",table:"settings"},()=>load()).subscribe();setInterval(()=>load(true),10000);load(true);
</script></body></html>
